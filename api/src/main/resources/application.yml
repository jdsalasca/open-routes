spring:
  application:
    name: open-routes

openroutes:
  remote:
    cache-dir: ${OPENROUTES_CACHE_DIR:cache}
    ttl-hours: 72
    max-download-mb: 300
    warmup: ${OPENROUTES_REMOTE_WARMUP:false}

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
    min-response-size: 1024
